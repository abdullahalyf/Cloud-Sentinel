[pytest]
pythonpath = .
testpaths = shared/tests brain/tests telemetry/tests eval/tests dashboard/tests infra/tests
# Slow suites are opt-in: `python -m pytest -q -m "e2e or chaos"` (the nightly workflow runs them).
addopts = -m "not e2e and not chaos and not live and not perf"
markers =
    e2e: full-stack tests that start real processes (nightly)
    chaos: fault-injection tests (nightly)
    live: needs a real API key or network (skipped without it)
    perf: timing-budget tests (nightly)
