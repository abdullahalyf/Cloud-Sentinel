# The 3 "AI agents" of our fake company.
#   Start:  docker compose up -d --build
#   Reset after a demo (bring killed agents back):  docker compose up -d --force-recreate
#   Stop:   docker compose down
#
# Pick HOW an agent goes rogue without editing this file (PowerShell example):
#   $env:BETA_ROGUE_TYPE="paraphrase_loop"; docker compose up -d --force-recreate
# Options: loop | token_bomb | memory_leak | paraphrase_loop
# Defaults: alpha=loop, beta=loop, gamma=memory_leak
#
# The sentinel itself runs on the laptop (python -m sentinel), not in a container.
# Every agent MUST have the label cloudsentinel.monitor=true or the sentinel ignores it.

x-agent: &agent
  build:
    context: .
    dockerfile: agents/Dockerfile
  image: cloudsentinel-agent
  mem_limit: 512m        # memory % in the dashboard is measured against this
  restart: "no"          # a killed agent must stay dead

services:
  agent-alpha:
    <<: *agent
    container_name: agent-alpha
    environment:
      AGENT_NAME: alpha
      ROGUE_TYPE: ${ALPHA_ROGUE_TYPE:-loop}
    labels:
      cloudsentinel.monitor: "true"
      cloudsentinel.agent_name: alpha
      cloudsentinel.token_budget: "150000"

  agent-beta:
    <<: *agent
    container_name: agent-beta
    environment:
      AGENT_NAME: beta
      ROGUE_TYPE: ${BETA_ROGUE_TYPE:-loop}
    labels:
      cloudsentinel.monitor: "true"
      cloudsentinel.agent_name: beta
      cloudsentinel.token_budget: "150000"

  agent-gamma:
    <<: *agent
    container_name: agent-gamma
    environment:
      AGENT_NAME: gamma
      ROGUE_TYPE: ${GAMMA_ROGUE_TYPE:-memory_leak}
      LEAK_CAP_MB: "440"   # keep below mem_limit (512m) so the leak is caught, not OOM-killed
    labels:
      cloudsentinel.monitor: "true"
      cloudsentinel.agent_name: gamma
      cloudsentinel.token_budget: "150000"